name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner has no Docker-in-Docker sandbox and no model server, and it must
  # not download a sentence-transformer on every run. The suite is designed to
  # pass with all three unavailable.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ruff is pinned deliberately. Unpinned, a release that adds or promotes
        # a rule fails master with no code change, which is what happened when
        # UP042 (str+Enum -> StrEnum) started being reported.
        pip install "ruff==0.14.14" pytest pytest-asyncio pytest-cov
        # SQLAlchemy is an optional dependency of the app but a required one of
        # the suite: it is what lets the relational connector be exercised
        # against a real database (SQLite, no server, no network). Without it
        # every connector test skips and the reference implementation is only a
        # docstring. A pure-Python wheel, so this costs seconds.
        pip install "sqlalchemy>=2.0"

    - name: Lint
      run: |
        ruff check .
        ruff format --check .

    - name: Test
      # Run from the repo root: pyproject sets testpaths and pythonpath.
      run: pytest --cov=backend/src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: wizard-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build sandbox image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/docker
        file: backend/docker/Dockerfile
        push: false
        tags: wizard-sandbox:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: wizard-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
