name: Production CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner has no Docker-in-Docker sandbox and no model server, and it must
  # not download a sentence-transformer on every run. The suite is designed to
  # pass with all three unavailable.
  ENV: test
  SANDBOX_ENABLED: "false"
  EMBEDDINGS_FORCE_FALLBACK: "true"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      # Both lock files are hash-pinned (`uv pip compile --generate-hashes`,
      # see the .in files) and requirements-ci-tools.lock.txt is compiled
      # *constrained* against requirements.lock.txt, so pytest-cov cannot drag
      # pytest to a version the rest of the suite was never run against.
      # SQLAlchemy -- what lets the relational connector be exercised against a
      # real database (SQLite, no server, no network); without it every
      # connector test skips -- arrives transitively via langchain and is
      # already pinned in requirements.lock.txt.
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock.txt
        pip install --require-hashes -r requirements-ci-tools.lock.txt

    - name: Lint
      run: |
        ruff check .
        ruff format --check .

    - name: Test
      # Run from the repo root: pyproject sets testpaths and pythonpath.
      run: pytest --cov=backend/src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Node.js 20
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

    - name: Build backend image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: Dockerfile
        push: false
        tags: wizard-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build sandbox image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ./backend/docker
        file: backend/docker/Dockerfile
        push: false
        tags: wizard-sandbox:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: wizard-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
