name: Dependency Audit

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    # Advisories are published continuously, so re-check even when nothing changes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Safety
        run: pip install safety

      - name: Scan runtime dependencies
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: safety scan --file requirements.txt --fail-on unignored

  node-audit:
    name: Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking gate: anything that reaches a user's browser must be clean.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Reported, not blocking. The remaining advisories are all dev-only and
      # currently unresolvable: the patched brace-expansion (>=5.0.8) changed its
      # export shape and breaks the minimatch bundled by the eslint plugins, so
      # applying the "fix" turns one advisory into fifteen and stops eslint from
      # running at all. Build tooling is not an end-user attack surface, and
      # blocking merges on an upstream conflict we cannot resolve would only
      # train people to ignore this job.
      - name: Audit build tooling (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
