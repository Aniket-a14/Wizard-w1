name: OSSF Scorecard

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '30 3 * * 1' # weekly — score drifts as dependencies/branch rules change, not just on push
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF to code scanning
      id-token: write        # to publish results and get a badge from api.securityscorecards.dev
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
